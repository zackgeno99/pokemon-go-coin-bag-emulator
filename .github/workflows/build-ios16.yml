name: Build iOS 16 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lower deployment target and enable iPad
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/CoinBag.xcodeproj/project.pbxproj")
          s = p.read_text()

          s = s.replace(
              "IPHONEOS_DEPLOYMENT_TARGET = 17.0;",
              "IPHONEOS_DEPLOYMENT_TARGET = 16.0;"
          )

          s = s.replace(
              "TARGETED_DEVICE_FAMILY = 1;",
              "TARGETED_DEVICE_FAMILY = 1,2;"
          )

          p.write_text(s)
          PY

      - name: Build
        run: |
          xcodebuild \
            -project ios/CoinBag.xcodeproj \
            -scheme CoinBag \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CoinBag.app Payload/
          zip -r CoinBag-iOS16.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CoinBag-iOS16
          path: CoinBag-iOS16.ipa
